$kind: http-request
url: "{{baseUrl}}/api/docs/openapi.json"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("es OpenAPI 3.1",()=>pm.expect(pm.response.json().openapi).to.eql("3.1.0"));
    language: text/javascript
order: 1000
