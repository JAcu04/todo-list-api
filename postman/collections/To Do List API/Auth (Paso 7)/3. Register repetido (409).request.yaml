$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "supersecreta"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 3000
