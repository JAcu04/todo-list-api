$kind: http-request
url: "{{baseUrl}}/api/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("trae id y email",()=>{const u=pm.response.json();pm.expect(u.id).to.exist;pm.expect(u.email).to.exist;});
    language: text/javascript
order: 6000
