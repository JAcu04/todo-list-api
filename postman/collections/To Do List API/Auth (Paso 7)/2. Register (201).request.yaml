$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "supersecreta"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.test("no devuelve el hash",()=>{const u=pm.response.json();pm.expect(u).to.not.have.property("password_hash");pm.expect(u.email).to.exist;});
    language: text/javascript
order: 2000
