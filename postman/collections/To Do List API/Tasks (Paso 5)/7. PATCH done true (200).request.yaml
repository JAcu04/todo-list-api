$kind: http-request
url: "{{baseUrl}}/api/tasks/{{taskId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "done": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("done = true",()=>pm.expect(pm.response.json().done).to.eql(true));
    language: text/javascript
order: 7000
